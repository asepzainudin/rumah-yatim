<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Anak Asuh — Smart Yatim</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="assets/tailwind.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="pb-10">
  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-slate-100 bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-lg items-center justify-between px-4">
      <div class="flex items-center gap-2">
        <button onclick="kembali()" aria-label="Kembali" class="-ml-1 rounded-xl p-2 text-slate-600 hover:bg-slate-100">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
        </button>
        <div>
          <h1 class="text-base font-extrabold text-slate-800">Katalog Anak Asuh</h1>
          <p class="text-[11px] text-slate-400">Pilih yang ingin Anda bantu</p>
        </div>
      </div>
      <button id="btn-filter" aria-label="Filter" class="relative rounded-xl p-2 text-slate-600 hover:bg-slate-100">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"/></svg>
        <span id="badge-filter" class="absolute right-1 top-1 hidden h-3.5 w-3.5 rounded-full bg-brand-purple text-[8px] font-bold leading-[14px] text-white">1</span>
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-lg px-4 py-5">
    <!-- Pencarian -->
    <div class="relative">
      <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" style="width:1.1rem;height:1.1rem" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      <input id="cari" type="search" class="input pl-10" placeholder="Cari nama anak asuh..." />
    </div>

    <!-- Ringkasan & chip filter -->
    <div class="mt-4 flex items-center justify-between">
      <p class="text-xs text-slate-500"><span id="jumlah-hasil" class="font-bold text-slate-700">0</span> anak asuh ditemukan</p>
      <button id="chip-reset" class="hidden rounded-full bg-brand-purple-light px-3 py-1 text-[11px] font-bold text-brand-purple">Hapus filter ✕</button>
    </div>

    <!-- Grid -->
    <div id="grid-katalog" class="mt-3 grid grid-cols-2 gap-3"></div>

    <!-- Empty state -->
    <div id="empty-state" class="card mt-4 hidden p-8 text-center">
      <div class="text-4xl">🔍</div>
      <p class="mt-2 text-sm font-bold text-slate-700">Tidak ada anak asuh</p>
      <p class="mt-1 text-xs text-slate-400">Coba ubah kata kunci atau filter provinsi Anda.</p>
    </div>
  </main>

  <!-- Modal Filter -->
  <div id="modal-filter" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/50 p-0 sm:items-center sm:p-4">
    <div class="card w-full max-w-sm rounded-b-none p-5 sm:rounded-3xl">
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-base font-extrabold text-slate-800">Filter Anak Asuh</h3>
        <button id="filter-tutup" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <label for="filter-provinsi" class="mb-1.5 block text-xs font-semibold text-slate-600">Pilih Provinsi Tempat Tinggal</label>
      <select id="filter-provinsi" class="input appearance-none bg-no-repeat" style="background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 fill=%22none%22 viewBox=%220 0 24 24%22 stroke=%22%2394a3b8%22 stroke-width=%222%22><path stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22M19.5 8.25l-7.5 7.5-7.5-7.5%22/></svg>');background-position:right 0.9rem center;background-size:1.1rem">
        <option value="">Semua Provinsi</option>
      </select>

      <div class="mt-5 flex gap-3">
        <button id="filter-reset" class="btn btn-outline flex-1">Reset</button>
        <button id="filter-terapkan" class="btn btn-primary flex-1">Terapkan</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let filterProvinsi = "";

    function kembali() {
      if (history.length > 1) history.back();
      else window.location.href = "beranda.html";
    }

    /* Isi dropdown provinsi */
    const selectProvinsi = document.getElementById("filter-provinsi");
    DAFTAR_PROVINSI.forEach((p) => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = p;
      selectProvinsi.appendChild(opt);
    });

    /* Render grid */
    function render() {
      const q = document.getElementById("cari").value.trim().toLowerCase();
      const hasil = DATA_ANAK.filter((a) => {
        const cocokCari = !q || a.nama.toLowerCase().includes(q) || a.kota.toLowerCase().includes(q) || a.id.toLowerCase().includes(q);
        const cocokFilter = !filterProvinsi || a.provinsi === filterProvinsi;
        return cocokCari && cocokFilter;
      });

      document.getElementById("jumlah-hasil").textContent = hasil.length;
      document.getElementById("grid-katalog").innerHTML = hasil.map((a) => UI.kartuAnak(a)).join("");
      document.getElementById("empty-state").classList.toggle("hidden", hasil.length > 0);
      document.getElementById("grid-katalog").classList.toggle("hidden", hasil.length === 0);

      const chip = document.getElementById("chip-reset");
      const badge = document.getElementById("badge-filter");
      chip.classList.toggle("hidden", !filterProvinsi);
      badge.classList.toggle("hidden", !filterProvinsi);
    }

    document.getElementById("cari").addEventListener("input", render);
    document.getElementById("chip-reset").addEventListener("click", () => {
      filterProvinsi = "";
      render();
      UI.toast("Filter dihapus", "info");
    });

    /* Modal filter */
    const modal = document.getElementById("modal-filter");
    function bukaModal() {
      selectProvinsi.value = filterProvinsi;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }
    function tutupModal() {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }
    document.getElementById("btn-filter").addEventListener("click", bukaModal);
    document.getElementById("filter-tutup").addEventListener("click", tutupModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) tutupModal();
    });

    document.getElementById("filter-terapkan").addEventListener("click", () => {
      filterProvinsi = selectProvinsi.value;
      tutupModal();
      render();
      UI.toast(filterProvinsi ? `Filter: ${filterProvinsi}` : "Menampilkan semua provinsi", "sukses");
    });

    document.getElementById("filter-reset").addEventListener("click", () => {
      filterProvinsi = "";
      selectProvinsi.value = "";
      tutupModal();
      render();
      UI.toast("Filter direset", "info");
    });

    render();
  </script>
</body>
</html>
