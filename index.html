<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Yatim — Pilih Pengguna</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="assets/tailwind.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="min-h-screen">
  <div class="relative flex min-h-screen flex-col overflow-hidden bg-gradient-to-br from-brand-green via-emerald-600 to-brand-purple">
    <div class="absolute -right-32 -top-32 h-96 w-96 rounded-full bg-white/10"></div>
    <div class="absolute -left-24 bottom-0 h-80 w-80 rounded-full bg-white/5"></div>
    <div class="absolute right-10 top-1/3 text-7xl opacity-20">🎨</div>
    <div class="absolute bottom-24 left-10 text-5xl opacity-20">✨</div>

    <!-- Header -->
    <header class="relative flex items-center gap-3 px-6 py-6 text-white sm:px-10">
      <img src="assets/images/logo.svg" alt="Logo Smart Yatim" class="h-11 w-11 rounded-xl bg-white/20 p-1.5" />
      <div>
        <p class="text-lg font-extrabold leading-tight">Smart Yatim</p>
        <p class="text-xs leading-tight text-white/70">Yatim Orta Platform</p>
      </div>
    </header>

    <!-- Konten -->
    <main class="relative mx-auto flex w-full max-w-lg flex-1 flex-col justify-center px-5 pb-14">
      <p class="text-center text-xs font-bold uppercase tracking-[.25em] text-white/70">Selamat Datang</p>
      <h1 class="mt-2 text-center text-3xl font-extrabold leading-tight text-white">
        Bersama... Melukis<br />Masa Depan Mereka
      </h1>
      <p class="mx-auto mt-3 max-w-sm text-center text-sm leading-relaxed text-white/80">
        Platform transparansi penyaluran donasi dan pengelolaan anak asuh.
        Silakan pilih untuk masuk sebagai:
      </p>

      <!-- Pilihan Role -->
      <div class="mt-8 space-y-3">
        <button onclick="pilihRole('admin', 'Admin')" class="card group flex w-full items-center gap-4 p-4 text-left transition hover:-translate-y-0.5 hover:shadow-lg">
          <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-green-light p-3">
            <svg class="h-7 w-7 text-brand-green" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM13.5 6A2.25 2.25 0 0115.75 3.75H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
          </div>
          <div class="flex-1">
            <p class="text-base font-extrabold text-slate-800">Admin</p>
            <p class="text-xs text-slate-500">Kelola data anak, laporan, dan anggaran secara penuh</p>
          </div>
          <svg class="h-5 w-5 text-slate-300 transition group-hover:translate-x-1 group-hover:text-brand-green" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </button>

        <button onclick="pilihRole('user', 'Petugas Lapangan')" class="card group flex w-full items-center gap-4 p-4 text-left transition hover:-translate-y-0.5 hover:shadow-lg">
          <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-purple-light p-3">
            <svg class="h-7 w-7 text-brand-purple" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
          </div>
          <div class="flex-1">
            <p class="text-base font-extrabold text-slate-800">Petugas Lapangan</p>
            <p class="text-xs text-slate-500">Input kegiatan, kebutuhan, dan laporan harian anak asuh</p>
          </div>
          <svg class="h-5 w-5 text-slate-300 transition group-hover:translate-x-1 group-hover:text-brand-purple" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </button>

        <button onclick="pilihRole('donatur', 'Donatur / Orang Tua Asuh')" class="card group flex w-full items-center gap-4 p-4 text-left transition hover:-translate-y-0.5 hover:shadow-lg">
          <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-50 p-3">
            <svg class="h-7 w-7 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
          </div>
          <div class="flex-1">
            <p class="text-base font-extrabold text-slate-800">Donatur</p>
            <p class="text-xs text-slate-500">Pilih anak asuh, donasi, dan pantau perkembangannya</p>
          </div>
          <svg class="h-5 w-5 text-slate-300 transition group-hover:translate-x-1 group-hover:text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </button>
      </div>

      <p class="mt-8 text-center text-xs text-white/60">© 2026 Rumah Yatim — SK Kemenag RI No. 209 Tahun 2017</p>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
    function pilihRole(role, label) {
      Store.set("pilihRole", { role, label });
      UI.toast(`Masuk sebagai ${label}`, "sukses");
      const tujuan = role === "donatur" ? "beranda.html" : "admin-dashboard.html";
      setTimeout(() => (window.location.href = tujuan), 500);
    }
  </script>
</body>
</html>
