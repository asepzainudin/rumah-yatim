<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anak Asuh Saya — Smart Yatim</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="assets/tailwind.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="pb-10">
  <header class="sticky top-0 z-40 border-b border-slate-100 bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-lg items-center gap-2 px-4">
      <button onclick="kembali()" aria-label="Kembali" class="-ml-1 rounded-xl p-2 text-slate-600 hover:bg-slate-100">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
      </button>
      <div>
        <h1 class="text-base font-extrabold text-slate-800">Anak Asuh Saya</h1>
        <p class="text-[11px] text-slate-400">Anak yang Anda dukung</p>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-lg px-4 py-5">
    <div id="daftar-anak" class="space-y-3"></div>

    <div id="empty-state" class="card p-8 text-center">
      <div class="text-4xl">🎗️</div>
      <p class="mt-2 text-sm font-bold text-slate-700">Belum ada anak asuh</p>
      <p class="mt-1 text-xs text-slate-400">Pilih anak asuh untuk mulai mendampingi mereka.</p>
      <a href="catalog.html" class="btn btn-primary mt-4 inline-flex">Lihat Katalog</a>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
    function kembali() {
      if (history.length > 1) history.back();
      else window.location.href = "beranda.html";
    }

    const anakSaya = Store.getAnakSaya();

    if (anakSaya.length === 0) {
      document.getElementById("empty-state").classList.remove("hidden");
    } else {
      document.getElementById("daftar-anak").innerHTML = anakSaya
        .map((d) => {
          const anak = DATA_ANAK.find((a) => a.id === d.id);
          if (!anak) return "";
          const terkumpul = Store.getTerkumpul(anak);
          const pct = UI.persen(anak.target, terkumpul);
          const ota = d.status.includes("OTA");
          return `
        <a href="detail-anak.html?id=${anak.id}" class="card flex items-center gap-3 p-3.5 transition hover:-translate-y-0.5 hover:shadow-md">
          ${UI.avatarHtml(anak.nama, anak.jenis, "h-12 w-12 text-sm")}
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <p class="truncate text-sm font-bold text-slate-800">${UI.escapeHtml(anak.nama)}</p>
              <span class="shrink-0 rounded-full ${ota ? "bg-brand-purple-light text-brand-purple" : "bg-brand-green-light text-brand-green"} px-2 py-0.5 text-[9px] font-bold">${UI.escapeHtml(d.status)}</span>
            </div>
            <p class="truncate text-[11px] text-slate-400">Sejak ${UI.escapeHtml(d.sejak)}</p>
            <div class="progress-track mt-1.5"><div class="progress-fill" style="width:${pct}%"></div></div>
            <p class="mt-1 text-[10px] text-slate-400">${UI.formatRupiah(terkumpul)} dari ${UI.formatRupiah(anak.target)}</p>
          </div>
          <svg class="h-4 w-4 shrink-0 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </a>`;
        })
        .join("");
    }
  </script>
</body>
</html>
