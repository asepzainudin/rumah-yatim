<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Donasi — Smart Yatim</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="assets/tailwind.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="pb-10">
  <header class="sticky top-0 z-40 border-b border-slate-100 bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-lg items-center gap-2 px-4">
      <button onclick="kembali()" aria-label="Kembali" class="-ml-1 rounded-xl p-2 text-slate-600 hover:bg-slate-100">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
      </button>
      <div>
        <h1 class="text-base font-extrabold text-slate-800">Riwayat Donasi</h1>
        <p class="text-[11px] text-slate-400">Semua transaksi Anda</p>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-lg px-4 py-5">
    <!-- Ringkasan -->
    <section class="grid grid-cols-2 gap-3">
      <div class="card p-4">
        <p class="text-xs font-semibold text-slate-400">Total Transaksi</p>
        <p id="total-transaksi" class="mt-1 text-xl font-extrabold text-slate-800">Rp0</p>
      </div>
      <div class="card p-4">
        <p class="text-xs font-semibold text-slate-400">Saldo Saat Ini</p>
        <p id="saldo-saat-ini" class="mt-1 text-xl font-extrabold text-brand-green">Rp0</p>
      </div>
    </section>

    <!-- Daftar -->
    <div id="daftar-riwayat" class="mt-4 space-y-3"></div>

    <div id="empty-state" class="card hidden p-8 text-center">
      <div class="text-4xl">🧾</div>
      <p class="mt-2 text-sm font-bold text-slate-700">Belum ada transaksi</p>
      <p class="mt-1 text-xs text-slate-400">Mulai donasi atau top up saldo Anda.</p>
      <a href="catalog.html" class="btn btn-primary mt-4 inline-flex">Mulai Berdonasi</a>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
    function kembali() {
      if (history.length > 1) history.back();
      else window.location.href = "beranda.html";
    }

    const riwayat = Store.getRiwayat();
    document.getElementById("saldo-saat-ini").textContent = UI.formatRupiah(Store.getSaldo());

    const totalKeluar = riwayat
      .filter((r) => r.jenis !== "Top Up")
      .reduce((sum, r) => sum + r.nominal, 0);
    document.getElementById("total-transaksi").textContent = UI.formatRupiah(totalKeluar);

    const ikon = {
      "Top Up": ["⬆", "bg-sky-50 text-sky-600"],
      "Donasi Saldo": ["❤", "bg-brand-green-light text-brand-green"],
      "Komitmen OTA": ["💜", "bg-brand-purple-light text-brand-purple"],
    };
    const warnaStatus = {
      Berhasil: "bg-brand-green-light text-brand-green",
      Aktif: "bg-brand-purple-light text-brand-purple",
    };

    if (riwayat.length === 0) {
      document.getElementById("empty-state").classList.remove("hidden");
    } else {
      document.getElementById("daftar-riwayat").innerHTML = riwayat
        .map((r) => {
          const [i, w] = ikon[r.jenis] || ["•", "bg-slate-100 text-slate-500"];
          return `
        <article class="card flex items-center gap-3 p-3.5">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ${w} text-base">${i}</div>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-bold text-slate-800">${UI.escapeHtml(r.jenis)}</p>
            <p class="truncate text-[11px] text-slate-400">${UI.escapeHtml(r.keterangan || "")}</p>
            <p class="mt-0.5 text-[10px] text-slate-300">${UI.escapeHtml(r.waktu)}</p>
          </div>
          <div class="text-right">
            <p class="text-sm font-extrabold text-slate-800">${r.jenis === "Top Up" ? "+" : "−"}${UI.formatRupiah(r.nominal)}</p>
            <span class="mt-1 inline-block rounded-full px-2 py-0.5 text-[9px] font-bold ${warnaStatus[r.status] || "bg-slate-100 text-slate-500"}">${UI.escapeHtml(r.status || "")}</span>
          </div>
        </article>`;
        })
        .join("");
    }
  </script>
</body>
</html>
