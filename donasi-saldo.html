<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donasi Saldo — Smart Yatim</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="assets/tailwind.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="pb-10">
  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-slate-100 bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-lg items-center gap-2 px-4">
      <button onclick="kembali()" aria-label="Kembali" class="-ml-1 rounded-xl p-2 text-slate-600 hover:bg-slate-100">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
      </button>
      <h1 class="text-base font-extrabold text-slate-800">Donasi dari Saldo</h1>
    </div>
  </header>

  <main class="mx-auto max-w-lg space-y-4 px-4 py-5">
    <!-- Anak yang didukung -->
    <section class="card flex items-center gap-3 p-3.5">
      <div id="avatar-anak" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full text-sm font-bold text-white"></div>
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-extrabold text-slate-800" id="nama-anak"></p>
        <p class="truncate text-[11px] text-slate-400" id="lokasi-anak"></p>
      </div>
      <span class="rounded-full bg-brand-green-light px-2.5 py-1 text-[10px] font-bold text-brand-green">Tujuan Donasi</span>
    </section>

    <!-- Info saldo -->
    <section class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-brand-green to-brand-green-dark p-4 text-white">
      <div class="absolute -right-6 -top-8 h-24 w-24 rounded-full bg-white/10"></div>
      <p class="relative text-xs text-white/75">Saldo Anda</p>
      <p class="relative mt-0.5 text-2xl font-extrabold" id="saldo-saat-ini"></p>
    </section>

    <!-- Input nominal -->
    <section class="card p-4">
      <label class="text-xs font-semibold text-slate-600">Nominal Donasi</label>
      <div class="mt-2 grid grid-cols-3 gap-2">
        <button class="chip-nominal rounded-xl border border-slate-200 py-2.5 text-xs font-bold text-slate-600 hover:border-brand-green" data-nominal="10000">Rp10.000</button>
        <button class="chip-nominal rounded-xl border border-slate-200 py-2.5 text-xs font-bold text-slate-600 hover:border-brand-green" data-nominal="25000">Rp25.000</button>
        <button class="chip-nominal rounded-xl border border-slate-200 py-2.5 text-xs font-bold text-slate-600 hover:border-brand-green" data-nominal="50000">Rp50.000</button>
        <button class="chip-nominal rounded-xl border border-slate-200 py-2.5 text-xs font-bold text-slate-600 hover:border-brand-green" data-nominal="100000">Rp100.000</button>
        <button class="chip-nominal rounded-xl border border-slate-200 py-2.5 text-xs font-bold text-slate-600 hover:border-brand-green" data-nominal="250000">Rp250.000</button>
        <button class="chip-nominal rounded-xl border border-slate-200 py-2.5 text-xs font-bold text-slate-600 hover:border-brand-green" data-nominal="500000">Rp500.000</button>
      </div>

      <label for="nominal" class="mb-1.5 mt-4 block text-xs font-semibold text-slate-600">Nominal lainnya</label>
      <input id="nominal" type="number" min="1000" class="input" placeholder="Masukkan nominal donasi" />

      <label for="doa" class="mb-1.5 mt-4 block text-xs font-semibold text-slate-600">Doa (opsional)</label>
      <textarea id="doa" rows="3" class="input resize-none" placeholder="Semoga menjadi kebaikan bagi kita semua..."></textarea>

      <button id="btn-konfirmasi" class="btn btn-primary mt-4 w-full py-3 text-base">
        ❤ Konfirmasi Donasi
      </button>
      <p class="mt-2 text-center text-[10px] text-slate-400">Simulasi — saldo hanya berubah di perangkat ini</p>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const anak = DATA_ANAK.find((a) => a.id === params.get("id")) || DATA_ANAK[0];
    let nominalTerpilih = 0;

    function kembali() {
      if (history.length > 1) history.back();
      else window.location.href = `detail-anak.html?id=${anak.id}`;
    }

    function render() {
      document.getElementById("avatar-anak").outerHTML = UI.avatarHtml(anak.nama, anak.jenis, "h-12 w-12 text-sm").replace('class="h-12 w-12 text-sm"', 'id="avatar-anak" class="h-12 w-12 shrink-0 text-sm"');
      document.getElementById("nama-anak").textContent = anak.nama;
      document.getElementById("lokasi-anak").textContent = `${anak.kota}, ${anak.provinsi}`;
      document.getElementById("saldo-saat-ini").textContent = UI.formatRupiah(Store.getSaldo());
    }
    render();

    document.querySelectorAll(".chip-nominal").forEach((chip) =>
      chip.addEventListener("click", () => {
        nominalTerpilih = Number(chip.dataset.nominal);
        document.getElementById("nominal").value = "";
        document.querySelectorAll(".chip-nominal").forEach((c) => {
          c.classList.remove("border-brand-green", "bg-brand-green-light", "text-brand-green");
          c.classList.add("border-slate-200");
        });
        chip.classList.add("border-brand-green", "bg-brand-green-light", "text-brand-green");
        chip.classList.remove("border-slate-200");
      })
    );

    document.getElementById("nominal").addEventListener("input", (e) => {
      nominalTerpilih = Number(e.target.value || 0);
      document.querySelectorAll(".chip-nominal").forEach((c) => {
        c.classList.remove("border-brand-green", "bg-brand-green-light", "text-brand-green");
        c.classList.add("border-slate-200");
      });
    });

    document.getElementById("btn-konfirmasi").addEventListener("click", () => {
      const nominal = nominalTerpilih || Number(document.getElementById("nominal").value || 0);
      if (!nominal || nominal < 1000) {
        UI.toast("Masukkan nominal minimal Rp1.000", "error");
        return;
      }
      if (nominal > Store.getSaldo()) {
        UI.toast(`Saldo tidak mencukupi. Saldo Anda ${UI.formatRupiah(Store.getSaldo())}`, "error");
        return;
      }

      const doa = document.getElementById("doa").value.trim();
      Store.kurangiSaldo(nominal);
      Store.tambahDonasiAnak(anak.id, nominal);
      Store.dukungAnak(anak.id, "Donatur");
      Store.tambahRiwayat({
        jenis: "Donasi Saldo",
        keterangan: `Donasi untuk ${anak.nama}${doa ? ` — "${doa}"` : ""}`,
        nominal,
        status: "Berhasil",
      });
      UI.toast(`Donasi ${UI.formatRupiah(nominal)} untuk ${anak.nama} tersalurkan 💚`, "sukses");
      setTimeout(() => (window.location.href = "beranda.html"), 1200);
    });
  </script>
</body>
</html>
